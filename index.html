<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>望京医院 - 全景导览</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 20px 30px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
        }

        .progress-indicator {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            font-weight: 500;
        }

        /* Panorama Container */
        #panorama-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #panorama, #panorama-next {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #panorama-next {
            opacity: 0;
            z-index: 5;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }

        #panorama-next.active {
            opacity: 1;
            z-index: 15;
            pointer-events: auto;
        }

        /* Navigation Controls */
        .nav-controls {
            position: fixed;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .nav-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.6);
            transform: scale(1.1);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Forward button - larger and more prominent */
        .nav-btn.forward {
            width: 64px;
            height: 64px;
            background: rgba(79, 172, 254, 0.4);
            border-color: rgba(79, 172, 254, 0.7);
        }

        .nav-btn.forward:hover {
            background: rgba(79, 172, 254, 0.6);
            border-color: rgba(79, 172, 254, 1);
        }

        /* Thumbnails */
        .thumbnails-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .thumbnails {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .thumbnail {
            width: 72px;
            height: 48px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .thumbnail:hover {
            border-color: rgba(255,255,255,0.5);
            transform: scale(1.05);
        }

        .thumbnail.active {
            border-color: #4facfe;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.6);
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-number {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* Location indicator */
        .location-indicator {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(20px);
            padding: 14px 28px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
            transition: all 0.4s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .location-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .location-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 12px;
        }

        .loading-progress-bar {
            width: 280px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .loading-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .loading-percentage {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }

        /* Keyboard hint */
        .keyboard-hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            text-align: center;
            transition: opacity 0.3s ease;
        }

        .keyboard-hint kbd {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            margin: 0 4px;
            font-family: inherit;
            font-weight: 500;
        }

        /* Pannellum customization */
        .pnlm-ui {
            border-radius: 0 !important;
        }

        .pnlm-zoom-controls {
            display: none !important;
        }

        .pnlm-controls-container {
            display: none !important;
        }

        /* Fade animation for location text */
        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }
            
            .header-title {
                font-size: 16px;
            }
            
            .header-subtitle {
                font-size: 12px;
            }
            
            .nav-controls {
                bottom: 120px;
            }
            
            .nav-btn {
                width: 48px;
                height: 48px;
            }
            
            .nav-btn.forward {
                width: 56px;
                height: 56px;
            }
            
            .thumbnail {
                width: 60px;
                height: 40px;
            }
            
            .location-indicator {
                top: 70px;
                padding: 10px 20px;
            }
            
            .location-name {
                font-size: 14px;
            }
            
            .location-desc {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">正在加载全景图...</div>
        <div class="loading-progress-bar">
            <div class="loading-progress-fill" id="loadingProgress"></div>
        </div>
        <div class="loading-percentage" id="loadingPercentage">0%</div>
    </div>

    <!-- Header -->
    <div class="header">
        <div>
            <div class="header-title">望京医院全景导览</div>
            <div class="header-subtitle">从入口到住院一部</div>
        </div>
        <div class="progress-indicator">
            <span id="currentIndex">1</span> / <span id="totalCount">6</span>
        </div>
    </div>

    <!-- Location indicator -->
    <div class="location-indicator" id="locationIndicator">
        <div class="location-name" id="locationName">医院入口</div>
        <div class="location-desc" id="locationDesc">望京医院正门入口</div>
    </div>

    <!-- Panorama container -->
    <div id="panorama-container">
        <div id="panorama"></div>
        <div id="panorama-next"></div>
    </div>

    <!-- Navigation controls -->
    <div class="nav-controls">
        <button class="nav-btn backward" id="backwardBtn" disabled>
            <svg viewBox="0 0 24 24">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
        </button>
        <button class="nav-btn forward" id="forwardBtn">
            <svg viewBox="0 0 24 24">
                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
        </button>
    </div>

    <!-- Keyboard hint -->
    <div class="keyboard-hint">
        使用 <kbd>\u2190</kbd> <kbd>\u2192</kbd> 方向键或点击按钮切换
    </div>

    <!-- Thumbnails -->
    <div class="thumbnails-container">
        <div class="thumbnails" id="thumbnails"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
        // Panorama data
        const panoramas = [
            {
                id: 1,
                name: "\u533b\u9662\u5165\u53e3",
                desc: "\u671b\u4eac\u533b\u9662\u6b63\u95e8\u5165\u53e3",
                image: "\u671b\u4eac\u533b\u96621.jpg"
            },
            {
                id: 2,
                name: "\u9662\u5185\u901a\u9053",
                desc: "\u8fdb\u5165\u533b\u9662\u540e\u7684\u4e3b\u901a\u9053",
                image: "\u671b\u4eac\u533b\u96622.jpg"
            },
            {
                id: 3,
                name: "\u9662\u5185\u9053\u8def",
                desc: "\u9662\u5185\u4e3b\u5e72\u9053",
                image: "\u671b\u4eac\u533b\u96623.jpg"
            },
            {
                id: 4,
                name: "\u95e8\u8bca\u533a\u57df",
                desc: "\u95e8\u8bca\u697c\u9644\u8fd1\u533a\u57df",
                image: "\u671b\u4eac\u533b\u96624.jpg"
            },
            {
                id: 5,
                name: "\u4f4f\u9662\u90e8\u5165\u53e3",
                desc: "\u4f4f\u9662\u90e8\u5927\u697c\u5165\u53e3",
                image: "\u671b\u4eac\u533b\u96625.jpg"
            },
            {
                id: 6,
                name: "\u4f4f\u9662\u4e00\u90e8",
                desc: "\u4f4f\u9662\u4e00\u90e8\u5185\u90e8",
                image: "\u671b\u4eac\u533b\u96626.jpg"
            }
        ];

        let currentIndex = 0;
        let viewer = null;
        let viewerNext = null;
        let isTransitioning = false;

        // Loading progress tracking
        let loadedImages = new Set();
        let totalImagesToLoad = 1;
        let loadProgress = 0;

        function updateLoadingProgress(percent) {
            loadProgress = Math.min(100, Math.max(0, percent));
            const progressBar = document.getElementById('loadingProgress');
            const percentageText = document.getElementById('loadingPercentage');
            const loadingText = document.getElementById('loadingText');
            
            if (progressBar) {
                progressBar.style.width = loadProgress + '%';
            }
            if (percentageText) {
                percentageText.textContent = Math.round(loadProgress) + '%';
            }
            if (loadingText) {
                if (loadProgress < 100) {
                    loadingText.textContent = '正在加载全景图...';
                } else {
                    loadingText.textContent = '加载完成！';
                }
            }
        }

        // Preload images with progress tracking
        function preloadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        // Initialize thumbnails
        function initThumbnails() {
            const container = document.getElementById('thumbnails');
            panoramas.forEach((pano, index) => {
                const thumb = document.createElement('div');
                thumb.className = 'thumbnail' + (index === 0 ? ' active' : '');
                thumb.innerHTML = `
                    <img src="${pano.image}" alt="${pano.name}">
                    <div class="thumbnail-number">${pano.id}</div>
                `;
                thumb.addEventListener('click', () => goToPanorama(index));
                container.appendChild(thumb);
            });
        }

        // Initialize panorama viewer
        async function initViewer(index, containerId) {
            const viewerConfig = {
                type: 'equirectangular',
                panorama: panoramas[index].image,
                autoLoad: true,
                showControls: false,
                showZoomCtrl: false,
                mouseZoom: true,
                draggable: true,
                disableKeyboardCtrl: true,
                pitch: 0,
                yaw: 0,
                hfov: 120
            };

            const newViewer = pannellum.viewer(containerId, viewerConfig);
            
            // Simulate progress while loading
            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 10;
                    updateLoadingProgress(progress);
                }
            }, 200);

            return new Promise((resolve) => {
                newViewer.on('load', () => {
                    clearInterval(progressInterval);
                    updateLoadingProgress(100);
                    resolve(newViewer);
                });
            });
        }

        // Go to specific panorama with smooth transition
        async function goToPanorama(index) {
            if (index < 0 || index >= panoramas.length || index === currentIndex || isTransitioning) {
                return;
            }

            isTransitioning = true;
            const direction = index > currentIndex ? 1 : -1;
            currentIndex = index;

            // Show loading overlay and reset progress
            document.getElementById('loadingOverlay').classList.remove('hidden');
            updateLoadingProgress(0);

            // Create next viewer and fade in
            viewerNext = await initViewer(index, 'panorama-next');
            
            // Fade in the new panorama
            document.getElementById('panorama-next').classList.add('active');
            
            // After transition, clean up
            setTimeout(() => {
                // Destroy old viewer
                if (viewer) {
                    viewer.destroy();
                }
                
                // Swap viewers
                viewer = viewerNext;
                viewerNext = null;
                
                // Reset the next container
                document.getElementById('panorama-next').classList.remove('active');
                document.getElementById('panorama-next').innerHTML = '';
                
                // Hide loading overlay
                document.getElementById('loadingOverlay').classList.add('hidden');
                isTransitioning = false;
                
                // Update UI
                updateUI(index);
            }, 800);

            updateUI(index);
        }

        // Update UI elements
        function updateUI(index) {
            // Update progress
            document.getElementById('currentIndex').textContent = index + 1;

            // Update location indicator
            const indicator = document.getElementById('locationIndicator');
            document.getElementById('locationName').textContent = panoramas[index].name;
            document.getElementById('locationDesc').textContent = panoramas[index].desc;
            
            // Add fade animation
            indicator.classList.remove('fade-in');
            void indicator.offsetWidth; // Force reflow
            indicator.classList.add('fade-in');

            // Update buttons
            document.getElementById('backwardBtn').disabled = index === 0;
            document.getElementById('forwardBtn').disabled = index === panoramas.length - 1;

            // Update thumbnails
            document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
                thumb.classList.toggle('active', i === index);
            });
        }

        // Event listeners
        document.getElementById('forwardBtn').addEventListener('click', () => {
            goToPanorama(currentIndex + 1);
        });

        document.getElementById('backwardBtn').addEventListener('click', () => {
            goToPanorama(currentIndex - 1);
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToPanorama(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPanorama(currentIndex - 1);
            }
        });

        // Touch swipe support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // Swipe left - next
                    goToPanorama(currentIndex + 1);
                } else {
                    // Swipe right - previous
                    goToPanorama(currentIndex - 1);
                }
            }
        }

        // Initialize
        document.getElementById('totalCount').textContent = panoramas.length;
        initThumbnails();
        
        // Start loading with progress
        (async function() {
            updateLoadingProgress(0);
            viewer = await initViewer(0, 'panorama');
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 500);
            updateUI(0);
        })();
    </script>
</body>
</html>
