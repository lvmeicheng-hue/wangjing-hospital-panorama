<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>望京医院 - 全景导览</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/pannellum/2.5.6/pannellum.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; width: 100vw;
        }
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 16px 24px;
            background: linear-gradient(180deg, rgba(10,15,30,0.9) 0%, rgba(10,15,30,0.5) 60%, transparent 100%);
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px);
        }
        .header-title {
            font-size: 20px; font-weight: 700; letter-spacing: 1px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; }
        .progress-indicator {
            font-size: 13px; color: rgba(255,255,255,0.9); background: rgba(79,172,254,0.2);
            padding: 6px 14px; border-radius: 16px; backdrop-filter: blur(10px); font-weight: 600;
            border: 1px solid rgba(79,172,254,0.3);
        }
        #panorama-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #panorama { width: 100%; height: 100%; }
        .nav-controls {
            position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 24px; z-index: 100;
        }
        .nav-btn {
            width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
            background: rgba(10,15,30,0.7); backdrop-filter: blur(20px); color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .nav-btn:hover { background: rgba(79,172,254,0.3); border-color: rgba(79,172,254,0.6); transform: scale(1.08); }
        .nav-btn:active { transform: scale(0.92); }
        .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
        .nav-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .nav-btn.forward {
            width: 68px; height: 68px;
            background: linear-gradient(135deg, rgba(79,172,254,0.6), rgba(0,242,254,0.4));
            border-color: rgba(79,172,254,0.7);
            box-shadow: 0 4px 20px rgba(79,172,254,0.3);
        }
        .nav-btn.forward:hover {
            background: linear-gradient(135deg, rgba(79,172,254,0.8), rgba(0,242,254,0.6));
            border-color: #4facfe; box-shadow: 0 4px 30px rgba(79,172,254,0.5);
        }
        .thumbnails-container {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: rgba(10,15,30,0.8); backdrop-filter: blur(20px); padding: 10px 14px;
            border-radius: 14px; border: 1px solid rgba(79,172,254,0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .thumbnails { display: flex; gap: 8px; align-items: center; }
        .thumbnail {
            width: 68px; height: 44px; border-radius: 8px; overflow: hidden; cursor: pointer;
            position: relative; border: 2px solid rgba(255,255,255,0.1); transition: all 0.3s ease; flex-shrink: 0;
        }
        .thumbnail:hover { border-color: rgba(79,172,254,0.5); transform: scale(1.08); }
        .thumbnail.active {
            border-color: #4facfe;
            box-shadow: 0 0 12px rgba(79,172,254,0.5), inset 0 0 8px rgba(79,172,254,0.2);
        }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .thumbnail-number {
            position: absolute; bottom: 3px; right: 3px; background: rgba(0,0,0,0.7);
            color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 4px; font-weight: 500;
        }
        .location-indicator {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: rgba(10,15,30,0.8); backdrop-filter: blur(20px); padding: 12px 24px;
            border-radius: 20px; border: 1px solid rgba(79,172,254,0.2); text-align: center;
            transition: all 0.4s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .location-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
        .location-desc { font-size: 11px; color: rgba(255,255,255,0.6); }
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, rgba(15,25,50,0.95) 0%, rgba(10,15,30,0.98) 100%);
            z-index: 200; display: flex; flex-direction: column; align-items: center;
            justify-content: center; transition: opacity 0.6s ease;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 48px; height: 48px; border: 3px solid rgba(79,172,254,0.15);
            border-top-color: #4facfe; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(79,172,254,0.2);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 15px; color: rgba(255,255,255,0.8); margin-bottom: 14px; font-weight: 500; }
        .loading-progress-bar { width: 240px; height: 5px; background: rgba(79,172,254,0.15); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
        .loading-progress-fill { height: 100%; background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); border-radius: 3px; transition: width 0.3s ease; width: 0%; box-shadow: 0 0 10px rgba(79,172,254,0.5); }
        .loading-percentage { font-size: 12px; color: rgba(79,172,254,0.6); font-weight: 500; }
        .keyboard-hint {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 100;
            font-size: 12px; color: rgba(255,255,255,0.5); text-align: center;
        }
        .keyboard-hint kbd { display: inline-block; padding: 3px 8px; background: rgba(255,255,255,0.15); border-radius: 4px; margin: 0 4px; font-family: inherit; font-weight: 500; }
        .pnlm-ui { border-radius: 0 !important; }
        .pnlm-zoom-controls, .pnlm-controls-container { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            .header { padding: 15px 20px; }
            .header-title { font-size: 16px; }
            .nav-controls { bottom: 120px; }
            .nav-btn { width: 48px; height: 48px; }
            .nav-btn.forward { width: 56px; height: 56px; }
            .thumbnail { width: 60px; height: 40px; }
            .location-indicator { top: 70px; padding: 10px 20px; }
            .location-name { font-size: 14px; }
        }

        /* Custom hotspot styles - Redesign */
        /* POI markers - pulsing dot with label */
        .hotspot-poi {
            display: flex; flex-direction: column; align-items: center; cursor: pointer;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7));
            transition: transform 0.2s ease;
        }
        .hotspot-poi:hover { transform: scale(1.15); }
        .hotspot-poi .poi-pin {
            position: relative; width: 32px; height: 40px;
        }
        .hotspot-poi .poi-pin::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 24px; height: 24px; background: linear-gradient(135deg, #ff6b35, #ff4500);
            border-radius: 50%; border: 3px solid #fff;
            box-shadow: 0 0 12px rgba(255,107,53,0.7), inset 0 -2px 4px rgba(0,0,0,0.2);
            animation: poiPulse 2s ease-in-out infinite;
        }
        .hotspot-poi .poi-pin::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-top: 12px solid #ff6b35;
        }
        @keyframes poiPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(255,107,53,0.7), inset 0 -2px 4px rgba(0,0,0,0.2); }
            50% { box-shadow: 0 0 24px rgba(255,107,53,1), inset 0 -2px 4px rgba(0,0,0,0.2); }
        }
        .hotspot-poi .poi-label {
            margin-top: 4px; background: linear-gradient(135deg, rgba(255,107,53,0.9), rgba(255,69,0,0.9));
            color: #fff; padding: 4px 12px; border-radius: 14px; font-size: 12px;
            white-space: nowrap; border: 2px solid rgba(255,255,255,0.5); font-weight: 600;
            box-shadow: 0 2px 8px rgba(255,107,53,0.4); letter-spacing: 0.5px;
        }

        /* Blue box for building highlights */
        .hotspot-blue-box {
            display: flex; flex-direction: column; align-items: center; cursor: pointer;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
        }
        .hotspot-blue-box .box-frame {
            width: 160px; height: 70px; border: 3px solid #4facfe; border-radius: 10px;
            background: rgba(79,172,254,0.1); display: flex; align-items: center;
            justify-content: center; animation: boxGlow 2s ease-in-out infinite;
            position: relative;
        }
        .hotspot-blue-box .box-frame::before,
        .hotspot-blue-box .box-frame::after {
            content: ''; position: absolute; width: 12px; height: 12px; border-color: #4facfe;
            border-style: solid;
        }
        .hotspot-blue-box .box-frame::before {
            top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0;
        }
        .hotspot-blue-box .box-frame::after {
            bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0;
        }
        @keyframes boxGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(79,172,254,0.3); }
            50% { box-shadow: 0 0 25px rgba(79,172,254,0.6); }
        }
        .hotspot-blue-box .box-label {
            margin-top: 6px; background: linear-gradient(135deg, rgba(79,172,254,0.9), rgba(0,242,254,0.9));
            color: #fff; padding: 4px 14px; border-radius: 12px; font-size: 13px; font-weight: 600;
            letter-spacing: 0.5px; white-space: nowrap;
            box-shadow: 0 2px 8px rgba(79,172,254,0.4);
        }

        /* SVG-based arrow hotspots */
        .hotspot-arrow {
            display: flex; flex-direction: column; align-items: center; cursor: pointer;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
        }
        .hotspot-arrow .arrow-icon {
            animation: arrowBounce 1.5s ease-in-out infinite;
        }
        .hotspot-arrow .arrow-icon svg {
            width: 40px; height: 40px;
        }
        @keyframes arrowBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }
        .hotspot-arrow .arrow-label {
            margin-top: 2px; background: linear-gradient(135deg, rgba(79,172,254,0.9), rgba(0,242,254,0.9));
            color: #fff; padding: 3px 10px; border-radius: 10px; font-size: 11px;
            white-space: nowrap; font-weight: 600; letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(79,172,254,0.3);
        }

        /* Override Pannellum hotspot styles */
        .pnlm-hotspot { pointer-events: auto !important; }
        .pnlm-hotspot .pnlm-poi, .pnlm-hotspot .pnlm-info { display: none !important; }
        .pnlm-hotspot > div:first-child {
            width: auto !important; height: auto !important; margin-top: 0 !important;
            margin-left: 0 !important;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">正在加载全景图...</div>
        <div class="loading-progress-bar"><div class="loading-progress-fill" id="loadingProgress"></div></div>
        <div class="loading-percentage" id="loadingPercentage">0%</div>
    </div>
    <div class="header">
        <div>
            <div class="header-title">望京医院全景导览</div>
            <div class="header-subtitle">从入口到住院一部</div>
        </div>
        <div class="progress-indicator"><span id="currentIndex">1</span> / 6</div>
    </div>
    <div class="location-indicator" id="locationIndicator">
        <div class="location-name" id="locationName">医院入口</div>
        <div class="location-desc" id="locationDesc">望京医院正门入口</div>
    </div>
    <div id="panorama-container"><div id="panorama"></div></div>
    <div class="nav-controls">
        <button class="nav-btn backward" id="backwardBtn" disabled>
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button class="nav-btn forward" id="forwardBtn">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </div>
    <div class="keyboard-hint">使用 <kbd>&larr;</kbd> <kbd>&rarr;</kbd> 方向键或点击按钮切换</div>
    <div class="thumbnails-container"><div class="thumbnails" id="thumbnails"></div></div>

    <script src="https://cdn.bootcdn.net/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
    <script>
        var sceneData = [
            { id: "s1", name: "医院入口", desc: "望京医院正门入口", image: "p1.jpg" },
            { id: "s2", name: "院内通道", desc: "进入医院后的主通道", image: "p2.jpg" },
            { id: "s3", name: "院内道路", desc: "院内主干道", image: "p3.jpg" },
            { id: "s4", name: "门诊区域", desc: "门诊楼附近区域", image: "p4.jpg" },
            { id: "s5", name: "住院部入口", desc: "住院部大楼入口", image: "p5.jpg" },
            { id: "s6", name: "住院一部", desc: "住院一部内部", image: "p6.jpg" }
        ];

        // Hotspot definitions for each scene
        // pitch: vertical (-90 to 90, 0=horizontal), yaw: horizontal (-180 to 180, 0=center)
        var hotspotsByScene = {
            s1: [
                // 门诊楼 - 左侧建筑入口 (blue box frame)
                { pitch: -5, yaw: -45, type: "blue-box", label: "门诊楼" },
                // 1号楼 - 中央白色高楼
                { pitch: -8, yaw: 10, type: "poi", label: "1号楼" },
                // Forward arrows along the lane (per user's red arrow)
                { pitch: -28, yaw: 5, type: "arrow-forward", label: "向前" },
                { pitch: -20, yaw: 10, type: "arrow-forward", label: "" },
                { pitch: -12, yaw: 15, type: "arrow-forward", label: "" }
            ],
            s2: [
                // 1号楼 POI (left side building in p2.jpg)
                { pitch: -5, yaw: -60, type: "poi", label: "1号楼" },
                // Forward arrows on the right side
                { pitch: -15, yaw: 50, type: "arrow-forward", label: "向前" },
                { pitch: -18, yaw: 40, type: "arrow-forward", label: "" },
                { pitch: -12, yaw: 60, type: "arrow-forward", label: "" }
            ],
            s3: [
                // Left turn arrows (road curves left in p3.jpg)
                { pitch: -20, yaw: -50, type: "arrow-left", label: "左转" },
                { pitch: -18, yaw: -65, type: "arrow-left", label: "" },
                { pitch: -22, yaw: -35, type: "arrow-left", label: "" }
            ],
            s4: [
                // Forward arrows (path toward 住院部 in p4.jpg)
                { pitch: -15, yaw: 20, type: "arrow-forward", label: "向前" },
                { pitch: -18, yaw: 10, type: "arrow-forward", label: "" },
                { pitch: -12, yaw: 30, type: "arrow-forward", label: "" }
            ],
            s5: [
                // Left turn arrows (path turns left toward 住院部 in p5.jpg)
                { pitch: -15, yaw: -50, type: "arrow-left", label: "左转" },
                { pitch: -18, yaw: -65, type: "arrow-left", label: "" },
                { pitch: -12, yaw: -35, type: "arrow-left", label: "" }
            ],
            s6: [
                // 四号楼 POI on the left (in p6.jpg, "四号楼" sign on building)
                { pitch: -10, yaw: -80, type: "poi", label: "四号楼" },
                // Blue box around 住院一部 (right side of the building)
                { pitch: -8, yaw: -40, type: "blue-box", label: "住院一部" }
            ]
        };

        var currentIndex = 0;
        var viewer = null;
        var isTransitioning = false;

        function updateProgress(pct) {
            document.getElementById('loadingProgress').style.width = Math.min(100, pct) + '%';
            document.getElementById('loadingPercentage').textContent = Math.round(pct) + '%';
            if (pct >= 100) document.getElementById('loadingText').textContent = '加载完成!';
        }

        // Create hotspot HTML element
        function createHotspotElement(hs) {
            var div = document.createElement('div');
            if (hs.type === "poi") {
                div.className = 'hotspot-poi';
                div.innerHTML = '<div class="poi-pin"></div><div class="poi-label">' + hs.label + '</div>';
            } else if (hs.type === "arrow-forward") {
                div.className = 'hotspot-arrow';
                div.innerHTML = '<div class="arrow-icon"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="arrGradF" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#00c6ff"/><stop offset="100%" stop-color="#4facfe"/></linearGradient></defs><path d="M20 4 L28 16 L24 16 L24 36 L16 36 L16 16 L12 16 Z" fill="url(#arrGradF)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>' + (hs.label ? '<div class="arrow-label">' + hs.label + '</div>' : '');
            } else if (hs.type === "arrow-left") {
                div.className = 'hotspot-arrow';
                div.innerHTML = '<div class="arrow-icon"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="arrGradL" x1="0%" y1="50%" x2="100%" y2="50%"><stop offset="0%" stop-color="#00c6ff"/><stop offset="100%" stop-color="#4facfe"/></linearGradient></defs><path d="M4 20 L16 12 L16 16 L36 16 L36 24 L16 24 L16 28 Z" fill="url(#arrGradL)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>' + (hs.label ? '<div class="arrow-label">' + hs.label + '</div>' : '');
            } else if (hs.type === "blue-box") {
                div.className = 'hotspot-blue-box';
                div.innerHTML = '<div class="box-frame"></div><div class="box-label">' + hs.label + '</div>';
            }
            return div;
        }

        function initThumbnails() {
            var c = document.getElementById('thumbnails');
            for (var i = 0; i < sceneData.length; i++) {
                (function(idx) {
                    var t = document.createElement('div');
                    t.className = 'thumbnail' + (idx === 0 ? ' active' : '');
                    t.innerHTML = '<img src="' + sceneData[idx].image + '" alt="' + sceneData[idx].name + '"><div class="thumbnail-number">' + (idx + 1) + '</div>';
                    t.onclick = function() { goTo(idx); };
                    c.appendChild(t);
                })(i);
            }
        }

        // Build Pannellum multi-scene config with hotspots
        function buildConfig() {
            var scenes = {};
            for (var i = 0; i < sceneData.length; i++) {
                var sid = sceneData[i].id;
                var sceneCfg = {
                    type: "equirectangular",
                    panorama: sceneData[i].image,
                    pitch: 0, yaw: 0, hfov: 120,
                    hotSpots: []
                };

                // Add hotspots for this scene
                var hss = hotspotsByScene[sid];
                if (hss) {
                    for (var j = 0; j < hss.length; j++) {
                        sceneCfg.hotSpots.push({
                            pitch: hss[j].pitch,
                            yaw: hss[j].yaw,
                            type: "info",
                            text: " ",
                            createTooltipFunc: (function(hs) {
                                return function() { return createHotspotElement(hs); };
                            })(hss[j])
                        });
                    }
                }
                scenes[sid] = sceneCfg;
            }
            return {
                "default": {
                    firstScene: "s1",
                    autoLoad: true,
                    showControls: false,
                    showZoomCtrl: false,
                    mouseZoom: true,
                    draggable: true,
                    disableKeyboardCtrl: true,
                    compass: false,
                    sceneFadeDuration: 1000
                },
                "scenes": scenes
            };
        }

        function goTo(idx) {
            if (idx < 0 || idx >= sceneData.length || idx === currentIndex || isTransitioning) return;
            isTransitioning = true;
            currentIndex = idx;
            document.getElementById('loadingOverlay').classList.remove('hidden');
            updateProgress(0);
            document.getElementById('loadingText').textContent = '正在加载全景图...';

            var prog = 0;
            var timer = setInterval(function() {
                if (prog < 85) { prog += Math.random() * 15; updateProgress(prog); }
            }, 150);

            // Use Pannellum native scene switching
            viewer.loadScene(sceneData[idx].id);

            viewer.on('scenechange', function onSceneChange() {
                viewer.off('scenechange', onSceneChange);
                clearInterval(timer);
                updateProgress(100);
                setTimeout(function() {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    isTransitioning = false;
                }, 400);
            });

            // Fallback: if scenechange doesn't fire within 8s, force hide loading
            setTimeout(function() {
                if (isTransitioning) {
                    clearInterval(timer);
                    updateProgress(100);
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    isTransitioning = false;
                }
            }, 8000);

            updateUI(idx);
        }

        function updateUI(idx) {
            document.getElementById('currentIndex').textContent = idx + 1;
            document.getElementById('locationName').textContent = sceneData[idx].name;
            document.getElementById('locationDesc').textContent = sceneData[idx].desc;
            var ind = document.getElementById('locationIndicator');
            ind.classList.remove('fade-in'); void ind.offsetWidth; ind.classList.add('fade-in');
            document.getElementById('backwardBtn').disabled = idx === 0;
            document.getElementById('forwardBtn').disabled = idx === sceneData.length - 1;
            var thumbs = document.querySelectorAll('.thumbnail');
            for (var i = 0; i < thumbs.length; i++) {
                thumbs[i].className = 'thumbnail' + (i === idx ? ' active' : '');
            }
        }

        document.getElementById('forwardBtn').onclick = function() { goTo(currentIndex + 1); };
        document.getElementById('backwardBtn').onclick = function() { goTo(currentIndex - 1); };
        document.onkeydown = function(e) {
            if (e.key === 'ArrowRight') { e.preventDefault(); goTo(currentIndex + 1); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(currentIndex - 1); }
        };

        // Initialize with multi-scene config
        initThumbnails();
        updateProgress(0);
        var prog = 0;
        var initTimer = setInterval(function() {
            if (prog < 85) { prog += Math.random() * 15; updateProgress(prog); }
        }, 150);

        viewer = pannellum.viewer('panorama', buildConfig());
        viewer.on('load', function() {
            clearInterval(initTimer);
            updateProgress(100);
            setTimeout(function() {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 300);
        });
        updateUI(0);
    </script>
</body>
</html>
